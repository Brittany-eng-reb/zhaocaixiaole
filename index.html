<title>招财小乐</title>
<style>

:root{
  --pink:#FFB6C1;
  --pink-dark:#F8A0AD;
  --pink-light:#FFF0F3;
  --pink-grad:linear-gradient(135deg,#FFD1DC 0%,#FFB6C1 100%);
  --warm-bg:#FFFAFA;
  --warm-gray:#FFF0F3;
  --white:#FFFFFF;
  --text-dark:#3D2B2B;
  --text-sub:#9E8888;
  --text-light:#C4B5B5;
  --shadow:0 2px 12px rgba(255,182,193,0.1);
  --radius:18px;
  --radius-sm:12px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  height:100%;width:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;
  background:var(--warm-bg);color:var(--text-dark);
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
}
button,input,textarea,select{font-family:inherit;outline:none;border:none;}
button{cursor:pointer;background:none;}
input,textarea{
  background:var(--warm-gray);border-radius:var(--radius-sm);border:1.5px solid transparent;
  padding:0 14px;font-size:14px;color:var(--text-dark);transition:all 0.2s;
}
input:focus,textarea:focus{border-color:var(--pink);background:#fff;}
textarea{padding:12px 14px;resize:none;min-height:80px;line-height:1.6;}
::-webkit-scrollbar{display:none;}

#app{height:100%;display:flex;flex-direction:column;padding-top:var(--safe-top);}

.topbar{
  flex-shrink:0;height:52px;background:var(--pink-grad);color:#fff;
  display:flex;align-items:center;padding:0 12px;position:relative;z-index:50;
  box-shadow:0 2px 10px rgba(255,182,193,0.2);
}
.topbar-title{font-size:17px;font-weight:600;flex:1;text-align:center;}
.menu-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;}
.menu-btn svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;}

.nav-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:98;opacity:0;visibility:hidden;transition:all 0.3s;}
.nav-overlay.show{opacity:1;visibility:visible;}
.side-nav{
  position:fixed;top:0;left:0;bottom:0;width:230px;z-index:99;
  background:#fff;transform:translateX(-100%);transition:transform 0.3s ease;
  display:flex;flex-direction:column;box-shadow:2px 0 20px rgba(0,0,0,0.1);
  padding-top:var(--safe-top);
}
.side-nav.open{transform:translateX(0);}
.nav-header{padding:24px 20px 16px;background:var(--pink-grad);color:#fff;}
.nav-header .logo-row{display:flex;align-items:center;gap:10px;}
.nav-header .logo-icon{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;font-size:22px;}
.nav-header h2{font-size:18px;font-weight:700;}
.nav-header p{font-size:12px;opacity:0.85;}
.nav-list{flex:1;overflow-y:auto;padding:8px 0;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:13px 20px;
  font-size:14px;color:var(--text-dark);transition:all 0.15s;position:relative;
}
.nav-item svg{width:19px;height:19px;stroke:var(--text-sub);fill:none;stroke-width:1.8;flex-shrink:0;}
.nav-item.active{background:var(--pink-light);color:var(--pink-dark);font-weight:600;}
.nav-item.active svg{stroke:var(--pink-dark);}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pink-dark);border-radius:0 2px 2px 0;}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:var(--safe-bottom);}
.page{display:none;padding:12px 12px 70px;animation:fadeIn 0.25s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.pet-fab{
  position:fixed;right:12px;bottom:90px;z-index:60;cursor:pointer;
  width:56px;height:56px;border-radius:50%;background:#fff;
  box-shadow:0 4px 16px rgba(255,182,193,0.3);display:flex;align-items:center;justify-content:center;
  transition:transform 0.2s;animation:petBounce 2.5s infinite;
}
.pet-fab:active{transform:scale(0.9);}
.pet-fab .badge{
  position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;
  background:#FF5252;color:#fff;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
@keyframes petBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.pet-panel{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;opacity:0;visibility:hidden;transition:all 0.3s;}
.pet-panel.show{opacity:1;visibility:visible;}
.pet-panel-bg{position:absolute;inset:0;background:rgba(0,0,0,0.4);}
.pet-panel-card{
  position:relative;width:100%;max-height:75vh;overflow-y:auto;
  background:#fff;border-radius:24px 24px 0 0;padding:24px 18px 32px;
  transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);
}
.pet-panel.show .pet-panel-card{transform:translateY(0);}
.pet-close{
  position:absolute;right:16px;top:16px;width:32px;height:32px;border-radius:50%;
  background:var(--warm-gray);display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--text-sub);
}
.pet-avatar-area{text-align:center;margin-bottom:16px;}
.pet-emoji{font-size:72px;display:inline-block;animation:petIdle 3s infinite;}
@keyframes petIdle{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-4px) rotate(-3deg)}75%{transform:translateY(-2px) rotate(3deg)}}
.pet-name{font-size:18px;font-weight:700;color:var(--text-dark);margin-top:4px;}
.pet-level{font-size:13px;color:var(--pink-dark);}
.pet-mood-text{font-size:14px;color:var(--text-sub);margin-top:4px;}
.bar-wrap{margin:10px 0;}
.bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-sub);margin-bottom:4px;}
.bar{height:8px;border-radius:4px;background:var(--warm-gray);overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width 0.5s ease;}
.bar-hunger{background:linear-gradient(90deg,#FF9800,#FF5722);}
.bar-happy{background:linear-gradient(90deg,#66BB6A,#A5D6A7);}
.pet-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0;}
.pet-stat{text-align:center;padding:10px 4px;background:var(--warm-gray);border-radius:var(--radius-sm);}
.pet-stat-num{font-size:18px;font-weight:700;color:var(--pink-dark);}
.pet-stat-label{font-size:11px;color:var(--text-sub);}

.card{
  background:#fff;border-radius:var(--radius);padding:16px 14px;
  box-shadow:var(--shadow);margin-bottom:12px;
}
.card-title{
  font-size:15px;font-weight:600;color:var(--pink-dark);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.card-title svg{width:18px;height:18px;stroke:var(--pink-dark);fill:none;stroke-width:2;}
.section-title{
  font-size:17px;font-weight:700;color:var(--text-dark);margin:8px 0 12px;
  display:flex;align-items:center;gap:8px;
}
.section-title .dot{width:4px;height:16px;background:var(--pink-dark);border-radius:2px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:40px;padding:0 18px;border-radius:10px;
  background:var(--pink-grad);color:#fff;font-size:14px;font-weight:600;
  box-shadow:0 2px 8px rgba(255,182,193,0.25);transition:transform 0.12s;
}
.btn:active{transform:scale(0.96);}
.btn-outline{background:#fff;color:var(--pink-dark);border:1.5px solid var(--pink-dark);box-shadow:none;}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}

.tag{
  display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500;
}
.tag-pink{background:var(--pink-light);color:var(--pink-dark);}
.tag-green{background:#E8F5E9;color:#2E7D32;}
.tag-orange{background:#FFF3E0;color:#E65100;}
.tag-red{background:#FFEBEE;color:#C62828;}
.tag-gray{background:var(--warm-gray);color:var(--text-sub);}

.empty-state{text-align:center;padding:36px 20px;color:var(--text-light);font-size:13px;}

.welcome-hero{
  background:var(--pink-grad);border-radius:var(--radius);padding:24px 18px;
  color:#fff;margin-bottom:14px;position:relative;overflow:hidden;
}
.welcome-hero::after{
  content:'';position:absolute;right:-20px;top:-30px;width:120px;height:120px;
  border-radius:50%;background:rgba(255,255,255,0.06);
}
.welcome-hero h1{font-size:22px;font-weight:700;margin-bottom:6px;position:relative;z-index:1;}
.welcome-hero .date{font-size:14px;opacity:0.9;margin-bottom:4px;position:relative;z-index:1;}
.welcome-hero .days{font-size:12px;opacity:0.85;position:relative;z-index:1;display:inline-flex;align-items:center;gap:4px;}
.welcome-hero .days .num{font-size:18px;font-weight:700;color:#FFF5F5;}

.quote-card{

<script>
var S=localStorage,K="zcxle3_";
var Store={
  get:function(key,def){try{var v=S.getItem(K+key);return v?JSON.parse(v):def||null}catch(e){return def||null}},
  set:function(key,val){S.setItem(K+key,JSON.stringify(val))}
};

var PET_CONFIG={
  stages:[
    {name:"小兔崽",emoji:"🐣",minDays:0,maxHappy:60},
    {name:"小兔宝",emoji:"🐰",minDays:3,maxHappy:80},
    {name:"活力兔",emoji:"🐇",minDays:7,maxHappy:100},
    {name:"优雅兔",emoji:"💖🐰",minDays:14,maxHappy:120},
    {name:"招财兔",emoji:"🌟🐰",minDays:30,maxHappy:150},
    {name:"神兔",emoji:"👑🐰",minDays:60,maxHappy:200}
  ],
  hungerDecayPerDay:15,
  happyDecayPerDay:8,
  feedHungerRestore:25,
  feedHappyBoost:15
};

function initPet(){
  var pet=Store.get("pet",{
    name:"招财兔",stage:0,hunger:80,happy:80,totalDays:0,streakDays:0,
    lastCheckin:"",lastFeedDate:"",totalFeedings:0,achievements:[]
  });
  var today=todayKey();
  if(pet.lastFeedDate&&pet.lastFeedDate!==today){
    var lastDate=new Date(pet.lastFeedDate);
    var daysSince=Math.floor((new Date(today)-lastDate)/86400000);
    if(daysSince>0){
      pet.hunger=Math.max(0,pet.hunger-PET_CONFIG.hungerDecayPerDay*daysSince);
      pet.happy=Math.max(0,pet.happy-PET_CONFIG.happyDecayPerDay*daysSince);
      if(daysSince>1)pet.streakDays=0;
    }
  }
  var nextStage=PET_CONFIG.stages[pet.stage+1];
  if(nextStage&&pet.totalDays>=nextStage.minDays){
    pet.stage++;
    if(pet.achievements.indexOf("stage_"+pet.stage)===-1)pet.achievements.push("stage_"+pet.stage);
  }
  Store.set("pet",pet);
  return pet;
}

function getCurrentStageCfg(pet){return PET_CONFIG.stages[pet.stage]||PET_CONFIG.stages[0];}
function getPetEmoji(pet){return getCurrentStageCfg(pet).emoji;}
function getPetName(pet){return getCurrentStageCfg(pet).name;}

function feedPet(source){
  var pet=Store.get("pet"),today=todayKey();
  if(pet.lastFeedDate===today&&pet.lastFeedSource===source)return false;
  var cfg=getCurrentStageCfg(pet);
  pet.hunger=Math.min(cfg.maxHappy,pet.hunger+PET_CONFIG.feedHungerRestore);
  pet.happy=Math.min(cfg.maxHappy,pet.happy+PET_CONFIG.feedHappyBoost);
  pet.totalFeedings++;
  if(pet.lastFeedDate!==today){
    if(pet.lastFeedDate){
      var diff=Math.floor((new Date(today)-new Date(pet.lastFeedDate))/86400000);
      if(diff===1)pet.streakDays++;else pet.streakDays=1;
    }else pet.streakDays=1;
    pet.totalDays++;
  }
  pet.lastFeedDate=today;pet.lastFeedSource=source;
  Store.set("pet",pet);updatePetUI();return true;
}

function updatePetUI(){
  var pet=Store.get("pet");if(!pet)return;
  var stage=getCurrentStageCfg(pet);
  document.getElementById("petFabEmoji").textContent=stage.emoji;
  var badge=document.getElementById("petFabBadge");
  if(pet.hunger<30||pet.happy<30){badge.style.display="flex";badge.textContent=pet.hunger<15?"😢":"!";}
  else{badge.style.display="none";}
}

function renderPetPanel(){
  var pet=Store.get("pet"),stage=getCurrentStageCfg(pet);
  var nextStage=PET_CONFIG.stages[pet.stage+1];
  var hungerPct=Math.round(pet.hunger/stage.maxHappy*100);
  var happyPct=Math.round(pet.happy/stage.maxHappy*100);
  var moodText,moodColor;
  if(pet.hunger<15){moodText="好饿...快喂我吃东西吧 😢";moodColor="#e53935";}
  else if(pet.hunger<40){moodText="肚子有点饿了~";moodColor="#FF9800";}
  else if(pet.happy<30){moodText="有点孤单，陪陪我吧";moodColor="#FF9800";}
  else if(pet.happy>80&&pet.hunger>70){moodText="超级开心！谢谢你照顾我 💕";moodColor="#4CAF50";}
  else if(pet.happy>60){moodText="今天心情不错~";moodColor="#4CAF50";}
  else{moodText="嗯...还可以吧";moodColor="var(--text-sub)";}
  var hungerWarning="";
  if(pet.hunger<15)hungerWarning='<div style="margin-top:8px;padding:8px 12px;background:#FFEBEE;border-radius:8px;font-size:12px;color:#C62828;text-align:center;">⚠️ 小兔快饿晕了！快去打卡喂养吧！</div>';
  else if(pet.hunger<30)hungerWarning='<div style="margin-top:8px;padding:8px 12px;background:#FFF3E0;border-radius:8px;font-size:12px;color:#E65100;text-align:center;">🍽️ 小兔有点饿了，记得今天打卡哦</div>';
  var nextInfo=nextStage?'<div style="text-align:center;margin:10px 0;padding:8px;background:var(--pink-light);border-radius:8px;font-size:12px;color:var(--pink-dark);">🔮 再坚持'+(nextStage.minDays-pet.totalDays)+'天进化成「'+nextStage.name+'」'+nextStage.emoji+'</div>':'<div style="text-align:center;margin:10px 0;padding:8px;background:#FFF8E1;border-radius:8px;font-size:12px;color:#F57F17;">👑 已达最高形态！继续打卡让神兔永远健康快乐~</div>';
  document.getElementById("petPanelCard").innerHTML=
    '<div class="pet-close" onclick="closePetPanel()">×</div>'+
    '<div class="pet-avatar-area"><div class="pet-emoji">'+stage.emoji+'</div>'+
    '<div class="pet-name">'+pet.name+' · '+stage.name+'</div>'+
    '<div class="pet-level">Lv.'+(pet.stage+1)+' · 陪伴第'+pet.totalDays+'天 · 连续'+pet.streakDays+'天</div>'+
    '<div class="pet-mood-text" style="color:'+moodColor+'">'+moodText+'</div>'+hungerWarning+'</div>'+
    '<div class="bar-wrap"><div class="bar-label"><span>🍎 饱腹度</span><span>'+pet.hunger+'/'+stage.maxHappy+'</span></div><div class="bar"><div class="bar-fill bar-hunger" style="width:'+hungerPct+'%"></div></div></div>'+
    '<div class="bar-wrap"><div class="bar-label"><span>💚 幸福度</span><span>'+pet.happy+'/'+stage.maxHappy+'</span></div><div class="bar"><div class="bar-fill bar-happy" style="width:'+happyPct+'%"></div></div></div>'+
    '<div class="pet-stats"><div class="pet-stat"><div class="pet-stat-num">'+pet.totalDays+'</div><div class="pet-stat-label">总天数</div></div><div class="pet-stat"><div class="pet-stat-num">'+pet.streakDays+'</div><div class="pet-stat-label">连续打卡</div></div><div class="pet-stat"><div class="pet-stat-num">'+pet.totalFeedings+'</div><div class="pet-stat-label">总喂养</div></div></div>'+nextInfo+
    '<div style="text-align:center;margin-top:16px;"><h4 style="font-size:15px;color:var(--text-dark);margin-bottom:12px;">📋 今日打卡喂养</h4><p style="font-size:12px;color:var(--text-sub);margin-bottom:12px;">写日记、做待办、记录心情、学英语、写笔记…都能喂小兔！</p>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'+
    '<button class="btn btn-sm" onclick="closePetPanel();navigateTo(\'todo\')">✅ 做待办</button>'+
    '<button class="btn btn-sm btn-outline" onclick="closePetPanel();navigateTo(\'about\')">📝 写日记</button>'+
    '<button class="btn btn-sm btn-outline" onclick="closePetPanel();navigateTo(\'english\')">🇬🇧 学英语</button>'+
    '<button class="btn btn-sm btn-outline" onclick="closePetPanel();navigateTo(\'reading\')">📚 去阅读</button></div></div>';
}

function openPetPanel(){renderPetPanel();document.getElementById("petPanel").classList.add("show");}
function closePetPanel(){document.getElementById("petPanel").classList.remove("show");}

var DB={
  quotes:["你今天的努力，是幸运的伏笔。","自律的本质，是把未来的自己放在心上。","每一个不曾起舞的日子，都是对生命的辜负。","慢慢来，比较快。","你有多自律，就有多自由。","种一棵树最好的时间是十年前，其次是现在。","星光不问赶路人，时光不负有心人。","把热爱做到极致，便成了价值。","你若盛开，蝴蝶自来。","所有闪闪发光的人生，都熬过一段不为人知的黑夜。","成长就是将你哭声调成静音的过程。","人生没有白走的路，每一步都算数。","愿你成为自己的太阳，无需凭借谁的光。","今日事，今日毕，明日还有明日事。","优秀的背后，都是自虐般的自律。","与其临渊羡鱼，不如退而结网。","不积跬步，无以至千里；不积小流，无以成江海。"],

    {name:"屠呦呦",tag:"药学家·诺贝尔奖得主",story:"从中医古籍中获得灵感，带领团队历经数百次实验提取出青蒿素，挽救了全球数百万人的生命。中国本土首位诺贝尔科学奖获得者。",quote:"青蒿素是中医药给世界的一份礼物。"},

    {name:"张桂梅",tag:"教育家·时代楷模",story:"扎根边疆教育40余年，创办全国第一所全免费女子高中，帮助1800多名贫困山区女孩圆了大学梦。身患多种疾病仍坚持每天5点陪学生晨读。",quote:"我生来就是高山而非溪流，我欲于群峰之巅俯视平庸的沟壑。"},

}

  var pet=Store.get("pet"),today=todayKey();
  if(pet.lastFeedDate===today)return;
  var ds=Store.get("diaries",[]),tds=Store.get("todos",[]);
  var todayDone=false;
  for(var i=0;i<tds.length;i++){if(tds[i].date===today&&tds[i].done){todayDone=true;break;}}
  var todayDiary=false;
  for(var i=0;i<ds.length;i++){if(ds[i].date===today){todayDiary=true;break;}}
  var todayMood=false;
  var ms=Store.get("moods",[]);
  for(var i=0;i<ms.length;i++){if(ms[i].date===today){todayMood=true;break;}}
  var todayEnglish=false;
  var es=Store.get("englishLogs",[]);
  for(var i=0;i<es.length;i++){if(es[i].date===today){todayEnglish=true;break;}}
  var todayExercise=false;
  var exs=Store.get("exerciseLogs",[]);
  for(var i=0;i<exs.length;i++){if(exs[i].date===today){todayExercise=true;break;}}
  var todayCalligraphy=false;
  var cls=Store.get("calligraphyLogs",[]);
  for(var i=0;i<cls.length;i++){if(cls[i].date===today){todayCalligraphy=true;break;}}
  var hasActivity=todayDone||todayDiary||todayMood||todayEnglish||todayExercise||todayCalligraphy;
  if(hasActivity&&feedPet(source)){}
}

function rMoodSummary(ms){
  if(ms.length===0)return '<div class="empty-state">还没有记录</div>';
  var r=ms.slice(-14),sum=0;
  for(var i=0;i<r.length;i++)sum+=r[i].val;
  var avg=(sum/r.length).toFixed(1);
  var cnts={};
  for(var i=0;i<r.length;i++){cnts[r[i].mood]=(cnts[r[i].mood]||0)+1;}
  var dom=null;
  for(var k in cnts){if(!dom||cnts[k]>cnts[dom])dom=k;}
  var trend=r.length>=2?(r[r.length-1].val>=r[0].val?"上升":"下降"):"稳定";
  return '<p style="font-size:13px;line-height:1.7;color:var(--text-sub);">最近'+r.length+'天平均心情：<strong style="color:var(--pink-dark);font-size:17px;">'+avg+'</strong>/5<br>趋势：<strong style="color:var(--pink-dark);">'+trend+'</strong> · 最常：<strong>'+(dom||"-")+'</strong></p>';
}

function genAI(){
  var area=$("aiArea");
  area.innerHTML='<div style="text-align:center;padding:24px;color:var(--pink-dark);font-size:13px;">AI正在分析<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>';
  setTimeout(function(){
    var ds=Store.get("diaries",[]),ms=Store.get("moods",[]),tds=Store.get("todos",[]),mls=Store.get("milestones",[]);
    var done=0,ttl=tds.length;
    for(var i=0;i<tds.length;i++){if(tds[i].done)done++;}
    var cr=ttl>0?(done/ttl*100).toFixed(0):0;
    var sum=0;for(var i=0;i<ms.length;i++)sum+=ms[i].val;
    var mavg=ms.length>0?(sum/ms.length).toFixed(1):0;
    var score=Math.min(100,Math.round(Number(cr)*0.3+Number(mavg)*10*0.3+Math.min(ds.length*5,30)*0.2+Math.min(mls.length*10,20)*0.2));
    var ma="";if(ms.length>0){var r=ms.slice(-7),s2=0;for(var i=0;i<r.length;i++)s2+=r[i].val;var avg2=s2/r.length;ma=avg2>=4?"近期情绪良好，积极向上":avg2>=3?"情绪平稳，偶有波动":"建议多关爱自己";}
    var da=ds.length>0?"已记录"+ds.length+"篇日记，坚持书写是极好的自我对话":"暂无日记";
    var ta=ttl>0?"共"+ttl+"项待办，完成"+done+"项，完成率"+cr+"%":"暂无待办";
    var hl=[];
    if(ds.length>0)hl.push("坚持写日记"+ds.length+"篇");
    if(ms.length>=3)hl.push("连续记录情绪"+ms.length+"天");
    if(mls.length>0)hl.push("记录"+mls.length+"个重要时刻");
    var imp=[];
    if(ds.length<3)imp.push("建议增加日记频率");
    if(ms.length<3)imp.push("多记录情绪发现规律");
    if(ttl===0||cr<40)imp.push("使用待办规划每日任务");
    if(imp.length===0)imp.push("各方面记录充实，继续保持！");
    var r={date:todayKey(),overallScore:score,moodAnalysis:ma,diaryAnalysis:da,todoAnalysis:ta,highlights:hl,improvements:imp,stats:{diaryCount:ds.length,moodCount:ms.length,todoTotal:ttl,todoDone:done,milestoneCount:mls.length}};
    Store.set("lastAIReport",r);area.innerHTML=renderAIHTML(r);
  },1800);
}
function renderAIHTML(r){
  var hl="",im="";

function rTodoList(){
  var tds=Store.get("todos",[]),td=todayKey(),tt=[];
  for(var i=0;i<tds.length;i++){if(tds[i].date===td)tt.push(tds[i]);}
  if(tt.length===0)return '<div class="empty-state">今日还没有待办</div>';
  var po={high:0,mid:1,low:2};
  tt.sort(function(a,b){return po[a.priority]-po[b.priority]||(a.done===b.done?0:a.done?1:-1);});
  var pt={high:'<span class="tag tag-red">高</span>',mid:'<span class="tag tag-orange">中</span>',low:'<span class="tag tag-gray">低</span>'};
  var html="";
  for(var i=0;i<tt.length;i++){
    var t=tt[i],ri=0;
    for(var j=0;j<tds.length;j++){if(tds[j].id===t.id){ri=j;break;}}
    html+='<div class="todo-item'+(t.done?" done":"")+'"><div class="todo-check'+(t.done?" done":"")+'" onclick="tgTodo('+ri+')">'+(t.done?'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>':"")+'</div><div class="todo-content"><div class="todo-text">'+t.text+'</div><div class="todo-meta">'+pt[t.priority]+'</div></div><button onclick="delTodo('+ri+')" style="color:var(--text-light);font-size:16px;">×</button></div>';
  }
  return html;
}
function addTodo(){
  var t=$("todoInput").value.trim();if(!t){toast("请输入内容");return;}
  var tds=Store.get("todos",[]);
  tds.push({id:Date.now(),text:t,priority:$("todoPri").value,done:false,date:todayKey()});
  Store.set("todos",tds);$("todoInput").value="";
  $("todoList").innerHTML=rTodoList();
  var td=todayKey(),tt=[],dc=0;
  var allTds=Store.get("todos",[]);
  for(var i=0;i<allTds.length;i++){if(allTds[i].date===td){tt.push(allTds[i]);if(allTds[i].done)dc++;}}
  var cards=document.querySelectorAll(".card");
  if(cards[0])cards[0].querySelector('div[style*="font-size:12px"]').textContent="今日完成 "+dc+"/"+tt.length;
  toast("已添加");feedPet("todo");
}
function tgTodo(i){
  var tds=Store.get("todos",[]);tds[i].done=!tds[i].done;Store.set("todos",tds);
  $("todoList").innerHTML=rTodoList();if(tds[i].done)feedPet("todo");
  var td=todayKey(),tt=[],dc=0;
  for(var j=0;j<tds.length;j++){if(tds[j].date===td){tt.push(tds[j]);if(tds[j].done)dc++;}}
  var cards=document.querySelectorAll(".card");
  if(cards[0])cards[0].querySelector('div[style*="font-size:12px"]').textContent="今日完成 "+dc+"/"+tt.length;
}
function delTodo(i){
  var tds=Store.get("todos",[]);tds.splice(i,1);Store.set("todos",tds);
  $("todoList").innerHTML=rTodoList();toast("已删除");
}
function aiOpt(){
  var input=$("aiTodoInput").value.trim();if(!input){toast("请输入计划");return;}
  var r=$("aiResult");
  r.innerHTML='<div style="text-align:center;padding:16px;color:var(--pink-dark);font-size:13px;">AI优化中<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>';
  setTimeout(function(){
    var tasks=input.split(/[\n,，;；、]/).map(function(s){return s.trim();}).filter(function(s){return s;});
    var pt=[];
    for(var i=0;i<tasks.length;i++){
      var p="mid";
      if(/急|紧|重要|马上|立刻|必须/i.test(tasks[i]))p="high";
      else if(/之后|有空|顺便/i.test(tasks[i]))p="low";
      pt.push({text:tasks[i],priority:p});
    }
    pt.sort(function(a,b){return ({high:0,mid:1,low:2})[a.priority]-({high:0,mid:1,low:2})[b.priority];});
    var ol="";
    for(var i=0;i<pt.length;i++){
      ol+='<li style="margin-bottom:4px;color:var(--text-sub);">'+pt[i].text+' <span class="tag '+(pt[i].priority==="high"?"tag-red":pt[i].priority==="low"?"tag-gray":"tag-orange")+'">'+(pt[i].priority==="high"?"先做":pt[i].priority==="low"?"有空做":"中")+'</span></li>';
    }
    r.innerHTML='<div style="background:var(--pink-light);border-radius:10px;padding:14px;margin-top:10px;font-size:13px;line-height:1.7;"><h4 style="color:var(--pink-dark);font-size:13px;margin-bottom:6px;">📋 优化执行顺序</h4><ol style="padding-left:16px;">'+ol+'</ol><h4 style="color:var(--pink-dark);font-size:13px;margin:8px 0 4px;">💡 建议</h4><ul style="padding-left:16px;"><li>精力最好时先攻克最难任务</li><li>每45分钟休息5分钟</li><li>同类任务集中处理减少切换</li><li>完成一项打个勾，积累成就感</li></ul></div>';
  },1500);
}

/* ===== 数据管理 ===== */
function exportData(){
  var data={};
  for(var i=0;i<S.length;i++){
    var key=S.key(i);
    if(key.indexOf(K)===0){
      try{data[key]=JSON.parse(S.getItem(key));}catch(e){data[key]=S.getItem(key);}
    }
  }
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  a.download="招财小乐备份_"+todayKey()+".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("数据已导出 📥");
}
function importData(){
  oModal('<div class="modal-header"><h3>导入数据</h3><div class="modal-close" onclick="cModal()">×</div></div><div class="form-group"><label>选择备份文件</label><input type="file" id="importFile" accept=".json" style="padding:8px 0;"></div><p style="font-size:12px;color:var(--text-sub);margin-bottom:12px;">⚠️ 导入会覆盖当前所有数据，请谨慎操作！</p><button class="btn btn-block" onclick="doImport()">确认导入</button>');
}
function doImport(){
  var file=$("importFile").files[0];
  if(!file){toast("请选择文件");return;}
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      var count=0;
      for(var key in data){
        if(data.hasOwnProperty(key)){
          S.setItem(key,JSON.stringify(data[key]));
          count++;
        }
      }
      cModal();init();toast("导入成功！共恢复"+count+"项数据 🎉");
    }catch(err){toast("文件格式错误");}
  };
  reader.readAsText(file);
}
function clearAllData(){
  if(!confirm("确定要清空所有数据吗？此操作不可恢复！"))return;
  for(var i=S.length-1;i>=0;i--){
    var key=S.key(i);
    if(key.indexOf(K)===0)S.removeItem(key);
  }
  init();toast("数据已清空");
}
